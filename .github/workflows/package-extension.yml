name: Release Firefox extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SERVER_BASE_URL: https://cowatch-2uvm.onrender.com
  # Set the repository variable JITSI_DOMAIN to your self-hosted Jitsi
  # (Settings → Secrets and variables → Actions → Variables). meet.jit.si
  # only works as a short demo when embedded.
  JITSI_DOMAIN: ${{ vars.JITSI_DOMAIN || 'meet.jit.si' }}

jobs:
  release:
    name: Test, package, and publish Firefox extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Validate tag and extension versions
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")"
          package_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "${GITHUB_REF_NAME}" != "v${tag_version}" \
            || "${tag_version}" != "${manifest_version}" \
            || "${manifest_version}" != "${package_version}" ]]; then
            echo "Version mismatch: tag=${GITHUB_REF_NAME}, manifest=${manifest_version}, package=${package_version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Build, verify, lint, and package
        run: npm run package
      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_title="CoWatch ${GITHUB_REF_NAME}"
          release_notes="Unsigned Firefox build for ${SERVER_BASE_URL} with video chat on ${JITSI_DOMAIN}. Load the ZIP temporarily from about:debugging#/runtime/this-firefox; Firefox removes it after restart. Everyone in a room needs this version: it is not compatible with servers or extensions older than v0.2.0."

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --prerelease
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
              --verify-tag \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --prerelease
          fi
